<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- タブレットでの拡大縮小を防ぎ、アプリのように表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>手書き英単語学習テスト</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    h1 {
      font-size: 1.2rem;
      color: #333;
    }
    #canvas-container {
      margin: 10px auto;
      touch-action: none; /* タブレットでの意図しないスクロールを防止 */
    }
    canvas {
      /* 見た目上の背景色（実際の画像データには反映されない） */
      background-color: #fff;
      border: 2px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      cursor: crosshair;
    }
    .btn {
      padding: 12px 24px;
      font-size: 1rem;
      margin: 10px 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      color: #fff;
    }
    .btn-clear { background-color: #6c757d; }
    .btn-send { background-color: #007bff; }
    #result-message {
      margin-top: 15px;
      font-weight: bold;
      color: #28a745;
    }
  </style>
</head>
<body>
  <h1>英単語を手書きしてください</h1>
  <div id="canvas-container">
    <!-- タブレットで書きやすいサイズに設定 -->
    <canvas id="draw-area" width="600" height="300"></canvas>
  </div>
  <div>
    <button class="btn btn-clear" id="btn-clear">クリア</button>
    <button class="btn btn-send" id="btn-send">送信テスト</button>
  </div>
  <div id="result-message"></div>

  <script>
    // 【重要】直近で取得した最新のGASのウェブアプリURLに書き換えてください
    const GAS_URL = "ここに最新のGASのURLを貼り付けてください";

    const canvas = document.getElementById('draw-area');
    const ctx = canvas.getContext('2d');
    const resultMessage = document.getElementById('result-message');

    // ====================================================================
    // ★重要追加：キャンバスの背景データを白で塗りつぶす（AIの認識エラー防止）
    // ====================================================================
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    let isDrawing = false;

    // ペンの太さと色の設定
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#000";

    // 座標取得関数 (マウス・タッチ両対応)
    const getPos = (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    };

    // 描画イベントの処理
    const startDrawing = (e) => {
      e.preventDefault();
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    };

    const draw = (e) => {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    };

    const stopDrawing = () => {
      isDrawing = false;
      ctx.closePath();
    };

    // マウスイベント
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseout', stopDrawing);

    // タッチイベント
    canvas.addEventListener('touchstart', startDrawing, {passive: false});
    canvas.addEventListener('touchmove', draw, {passive: false});
    canvas.addEventListener('touchend', stopDrawing);

    // クリアボタンの処理
    document.getElementById('btn-clear').addEventListener('click', () => {
      // ★修正：clearRectではなく、画面を白で塗りつぶして初期化する
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      resultMessage.innerText = "";
      resultMessage.style.color = "#333";
    });

    // 送信テストボタンの処理
    document.getElementById('btn-send').addEventListener('click', () => {
      resultMessage.innerText = "送信中...";
      resultMessage.style.color = "#333";

      // キャンバスの画像をBase64形式で取得
      const imageBase64 = canvas.toDataURL("image/png");

      // 送信するデータ（今回はID:1 の zero をテスト送信）
      const payload = {
        wordId: 1, 
        imageBase64: imageBase64
      };

      // GASへデータ送信
      fetch(GAS_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain" // GASのCORS制約を回避するためtext/plain
        },
        body: JSON.stringify(payload)
      })
      .then(response => response.json())
      .then(data => {
        if(data.status === "success") {
          resultMessage.style.color = "#28a745"; // 成功時は緑
          resultMessage.innerText = data.message;
        } else {
          resultMessage.style.color = "#dc3545"; // 判定エラー時は赤
          resultMessage.innerText = data.message;
        }
      })
      .catch(error => {
        resultMessage.style.color = "#dc3545";
        resultMessage.innerText = "通信エラーが発生しました: " + error.message;
      });
    });
  </script>
</body>
</html>
