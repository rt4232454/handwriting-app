<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>英語学習クエスト</title>
  <style>
    body { font-family: sans-serif; text-align: center; background-color: #f4f4f9; margin: 0; padding: 20px; }
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 80vh; }
    .user-btn { width: 80%; max-width: 300px; padding: 15px; margin: 10px; font-size: 1.2rem; background-color: #6f42c1; color: white; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    #app-screen { display: none; }
    #status-bar { display: flex; justify-content: space-between; background: #333; color: #fff; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; font-size: 0.9rem; }
    
    h1 { font-size: 1.2rem; color: #333; margin-bottom: 5px; }
    #question-text { font-size: 1.6rem; color: #0056b3; margin: 10px 0 20px 0; min-height: 3rem; }
    #canvas-container { margin: 10px auto; touch-action: none; }
    canvas { background-color: #fff; border: 2px solid #ccc; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    
    .btn-group { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; max-width: 600px; margin: 0 auto; }
    .btn { padding: 12px 20px; font-size: 1rem; border: none; border-radius: 5px; cursor: pointer; color: #fff; font-weight: bold; flex-grow: 1; }
    .btn-clear { background-color: #6c757d; flex-grow: 0; }
    .btn-send { background-color: #007bff; }
    /* 「読んで！」ボタンのデザイン変更 */
    .btn-read { background-color: #17a2b8; color: #fff; }
    .btn-next { background-color: #28a745; display: none; width: 100%; margin-top: 10px; }
    #result-message { margin-top: 15px; font-size: 1.1rem; font-weight: bold; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div id="login-screen">
    <h2>名前を選んでね</h2>
    <button class="user-btn" onclick="login('のぞみち')">のぞみち</button>
    <button class="user-btn" onclick="login('ゆいみち')">ゆいみち</button>
    <button class="user-btn" onclick="login('まこみち')">まこみち</button>
    <button class="user-btn" onclick="login('ちえみち')">ちえみち</button>
    <button class="user-btn" onclick="login('じゅんみち')">じゅんみち</button>
  </div>

  <div id="app-screen">
    <div id="status-bar">
      <span id="display-name">名前</span>
      <span>Lv.<span id="display-level">1</span> (EXP:<span id="display-exp">0</span>)</span>
      <span>🔥<span id="display-streak">0</span>日</span>
    </div>
    
    <div id="question-text">読み込み中...</div>
    
    <div id="canvas-container">
      <canvas id="draw-area" width="600" height="300"></canvas>
    </div>
    
    <div class="btn-group">
      <button class="btn btn-clear" id="btn-clear">消しゴム</button>
      <button class="btn btn-send" id="btn-send">✍️ 書いた！</button>
      <button class="btn btn-read" id="btn-read">🔊 読んで！</button>
    </div>
    <button class="btn btn-next" id="btn-next">次の問題へ ＞</button>
    
    <div id="result-message"></div>
  </div>

  <script>
    // 【重要】最新のGASのURLに書き換えてください
    const GAS_URL = "https://script.google.com/macros/s/AKfycbzFo01HmF_3sX5L5-lXy4K95dXoU-IoJVTGmwYNENofwru8NN1y5gzXMOdbxNpNHeoE/exec";
    let currentUser = "";
    let currentWordId = null;
    let currentSpeechText = ""; // 読み上げるテキストを記憶する変数

    function login(name) {
      currentUser = name;
      document.getElementById('display-name').innerText = name;
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app-screen').style.display = 'block';
      loadNextQuestion();
    }

    const canvas = document.getElementById('draw-area');
    const ctx = canvas.getContext('2d');
    const resultMessage = document.getElementById('result-message');
    const questionText = document.getElementById('question-text');
    const btnSend = document.getElementById('btn-send');
    const btnRead = document.getElementById('btn-read');
    const btnNext = document.getElementById('btn-next');

    let isDrawing = false;
    const initCanvas = () => { ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.strokeStyle = "#000"; };
    initCanvas();
    const getPos = (e) => { const rect = canvas.getBoundingClientRect(); const clientX = e.touches ? e.touches[0].clientX : e.clientX; const clientY = e.touches ? e.touches[0].clientY : e.clientY; return { x: clientX - rect.left, y: clientY - rect.top }; };
    canvas.addEventListener('mousedown', (e) => { e.preventDefault(); isDrawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); });
    canvas.addEventListener('mousemove', (e) => { if (!isDrawing) return; e.preventDefault(); const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); });
    canvas.addEventListener('mouseup', () => { isDrawing = false; ctx.closePath(); });
    canvas.addEventListener('mouseout', () => { isDrawing = false; ctx.closePath(); });
    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); isDrawing = true; const pos = getPos(e); ctx.beginPath(); ctx.moveTo(pos.x, pos.y); }, {passive: false});
    canvas.addEventListener('touchmove', (e) => { if (!isDrawing) return; e.preventDefault(); const pos = getPos(e); ctx.lineTo(pos.x, pos.y); ctx.stroke(); }, {passive: false});
    canvas.addEventListener('touchend', () => { isDrawing = false; ctx.closePath(); });
    document.getElementById('btn-clear').addEventListener('click', () => { initCanvas(); if(btnNext.style.display === "none") resultMessage.innerText = ""; });

    const updateStats = (stats) => {
      if(stats) {
        document.getElementById('display-level').innerText = stats.level;
        document.getElementById('display-exp').innerText = stats.exp;
        document.getElementById('display-streak').innerText = stats.streak;
      }
    };

    const loadNextQuestion = () => {
      resultMessage.innerText = "通信中..."; resultMessage.style.color = "#333";
      questionText.innerText = "...";
      btnNext.style.display = "none"; btnSend.disabled = false; btnRead.disabled = false; initCanvas();
      currentSpeechText = "";

      fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "get_question", userName: currentUser }) })
      .then(res => res.json())
      .then(data => {
        if(data.status === "success" && data.question) {
          updateStats(data.stats);
          currentWordId = data.question.id;
          let qHTML = data.question.ja;
          
          // 読み上げテキストの構築ロジック
          currentSpeechText = data.question.ans;
          if(data.question.en) {
            const formattedEn = data.question.en.replace(/___/g, '<span style="color: #ff9800; font-weight: bold; font-size: 1.2em;">[  ]</span>');
            qHTML += "<br><span style='font-size: 0.9em; color: #555; display: inline-block; margin-top: 5px;'>" + formattedEn + "</span>";
            
            // 穴埋め問題の場合、正解を自動ではめ込んでから読み上げるようにする
            let cleanAns = data.question.ans.replace(/\[.*?\]|\(.*?\)/g, "").trim();
            let ansParts = cleanAns.split(/\s+/);
            let qParts = data.question.en.split("___");
            currentSpeechText = qParts[0];
            for(let i = 1; i < qParts.length; i++) {
              currentSpeechText += (ansParts[i-1] || "") + qParts[i];
            }
          }
          
          questionText.innerHTML = qHTML;
          resultMessage.innerText = "";
        } else if (data.status === "success" && !data.question) {
          updateStats(data.stats);
          questionText.innerHTML = "🎉 今日のクエスト完了！";
          resultMessage.style.color = "#28a745"; resultMessage.innerText = data.message;
          btnSend.style.display = "none"; btnRead.style.display = "none"; document.getElementById('btn-clear').style.display = "none";
        }
      });
    };
    btnNext.addEventListener('click', loadNextQuestion);

    const handleResult = (data) => {
      if(data.status === "success") {
        resultMessage.style.color = data.isCorrect ? "#28a745" : "#dc3545"; resultMessage.innerText = data.message;
        btnNext.style.display = "inline-block";
      }
      btnSend.disabled = false; btnRead.disabled = false;
    };

    btnSend.addEventListener('click', () => {
      if(!currentWordId) return;
      resultMessage.innerText = "AIが判定中..."; resultMessage.style.color = "#333";
      btnSend.disabled = true; btnRead.disabled = true;
      fetch(GAS_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ action: "submit_answer", userName: currentUser, wordId: currentWordId, imageBase64: canvas.toDataURL("image/png") }) })
      .then(res => res.json()).then(handleResult);
    });

    // 「読んで！」ボタンの音声合成（読み上げ）処理
    btnRead.addEventListener('click', () => {
      if(!currentSpeechText) return;
      // 万が一前の音声が残っていたらキャンセル
      window.speechSynthesis.cancel();
      
      const utterance = new SpeechSynthesisUtterance(currentSpeechText);
      utterance.lang = 'en-US';
      utterance.rate = 0.85; // お子様が聞き取りやすいよう、少しゆっくりめのスピード
      window.speechSynthesis.speak(utterance);
    });
  </script>
</body>
</html>
